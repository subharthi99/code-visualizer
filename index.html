<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Think through algorithms. Build an approach, discover edge cases, and dry-run your reasoning before coding.">
    <title>Code Visualizer — Think before you code</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./src/styles.css">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to workspace</a>
    <div id="app"><main class="loading">Opening your workspace…</main></div>
    <div id="notice" class="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript>This local workspace needs JavaScript. Your notes stay in this browser.</noscript>
  </body>
</html>
